<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>FORMA — iPhone та PC</title>
<link rel="stylesheet" href="./style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header">
  <a class="logo" href="./">FORMA</a>
  <button class="cart" id="channelBtn">Telegram</button>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">FORMA SHOP</div>
    <h1>Техніка, яку<br>хочеться мати.</h1>
    <p>iPhone та готові PC-збірки. Обирай товар і пиши менеджеру напряму.</p>
    <div class="tabs">
      <button class="tab active" data-cat="all">Усі</button>
      <button class="tab" data-cat="iphone">iPhone</button>
      <button class="tab" data-cat="pc">PC</button>
    </div>
  </section>

  <section class="section">
    <div id="status" class="status">Завантаження товарів…</div>
    <div id="products" class="grid"></div>
  </section>
</main>

<div id="detail" class="modal hidden">
  <div class="modal-bg" id="closeBg"></div>
  <div class="sheet">
    <button class="close" id="closeDetail">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<footer>
  <div>FORMA © 2026</div>
  <a href="https://t.me/StoreFORMA_bot?startapp">Відкрити в Telegram</a>
</footer>

<script src="./app.js"></script>
</body>
</html>
